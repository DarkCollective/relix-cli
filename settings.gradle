plugins {
    // Lets the Java 21 toolchain be provisioned on a machine that has no Java 21.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'relix-cli'

// Building against a local engine checkout: `./gradlew build -PrelixCore=../relix-core`.
//
// A composite build: the engine's artifacts are built from that checkout instead of being
// downloaded, whatever relixEngineVersion says. The coordinates are mapped by hand because
// relix-core publishes `relix` from its relix-dist project, whose name is not the
// artifact's; the other two are published under their projects' own names.
def relixCore = providers.gradleProperty('relixCore').orNull
if (relixCore) {
    includeBuild(relixCore) {
        dependencySubstitution {
            substitute module('com.darkcollective.relix:relix') using project(':relix-dist')
            substitute module('com.darkcollective.relix:relix-docs') using project(':relix-docs')
            substitute module('com.darkcollective.relix:relix-solver-ojalgo') using project(':relix-solver-ojalgo')
        }
    }
}
