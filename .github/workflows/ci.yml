# The gate: `./gradlew clean build`, then the platform archive's tests, on Linux, macOS
# and Windows, for every pull request and every push to main or develop.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
      # Also validates the checked-in wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
      # The completion scripts are syntax-checked by each shell that is installed; the
      # runners have bash and PowerShell, and Linux gets zsh and fish here.
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: ./gradlew clean build
      # The platform archive, run as it ships: a pipeline through its launcher, the CDS
      # archive mapped, the man pages rendered.
      - run: ./gradlew packageTest
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
          if-no-files-found: ignore
